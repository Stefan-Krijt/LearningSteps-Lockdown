#cloud-config

apt:
  sources:
    pgdg.list:
      source: "deb [signed-by=$KEY_FILE] https://apt.postgresql.org/pub/repos/apt jammy-pgdg main"
      keyid: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
      keyserver: keyserver.ubuntu.com

packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - postgresql-client-16
  - ca-certificates
  - curl

write_files:
  - path: /usr/local/bin/start-learningsteps.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      TOKEN=$(curl -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net' -H Metadata:true | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
      DB_PASS=$(curl -s 'https://kv-lokiyn-ls.vault.azure.net/secrets/postgres-admin-password?api-version=7.4' -H "Authorization: Bearer $TOKEN" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
      export DATABASE_URL="postgresql://psqladmin:$${DB_PASS}@psql-$${prefix}.postgres.database.azure.com/learning_journal?sslmode=require"
      cd /opt/learningsteps/api
      exec /opt/learningsteps/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000

  - path: /usr/local/bin/start-oauth2-proxy.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      TOKEN=$(curl -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net' -H Metadata:true | jq -r .access_token)
      OAUTH_SECRET=$(curl -s 'https://kv-lokiyn-ls.vault.azure.net/secrets/oauth2-client-secret?api-version=7.4' -H "Authorization: Bearer $TOKEN" | jq -r .value)
      COOKIE_SECRET=$(curl -s 'https://kv-lokiyn-ls.vault.azure.net/secrets/oauth2-cookie-secret?api-version=7.4' -H "Authorization: Bearer $TOKEN" | jq -r .value)

      cat > /etc/oauth2-proxy/oauth2-proxy.env <<EOF
      OAUTH2_PROXY_CLIENT_ID=${oauth2_client_id}
      OAUTH2_PROXY_CLIENT_SECRET=$OAUTH_SECRET
      OAUTH2_PROXY_OIDC_ISSUER_URL=https://login.microsoftonline.com/${tenant_id}/v2.0
      OAUTH2_PROXY_OIDC_EXTRA_AUDIENCES=api://${oauth2_client_id}
      OAUTH2_PROXY_COOKIE_SECRET=$COOKIE_SECRET
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS=true
      EOF

      exec /usr/local/bin/oauth2-proxy --provider=oidc --email-domain=* --http-address=127.0.0.1:4180 --redirect-url=https://${prefix}.westeurope.cloudapp.azure.com/oauth2/callback --whitelist-domain=.westeurope.cloudapp.azure.com --oidc-email-claim=preferred_username --insecure-oidc-allow-unverified-email=true

  - path: /etc/systemd/system/learningsteps.service
    content: |
      [Unit]
      Description=LearningSteps API
      After=network.target
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/start-learningsteps.sh
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/oauth2-proxy.service
    content: |
      [Unit]
      Description=oauth2-proxy
      After=network.target
      [Service]
      Type=simple
      ExecStart=/usr/local/bin/start-oauth2-proxy.sh
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

runcmd:
  # 0. Stop background apt processes from fighting with cloud-init
  - systemctl mask --now apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service unattended-upgrades.service

  # 1. Setup LearningSteps App
  - timeout 120 git clone https://github.com/CyberstepsDE/learningsteps.git /opt/learningsteps || true
  - python3 -m venv /opt/learningsteps/venv
  - /opt/learningsteps/venv/bin/pip install --upgrade pip -q
  - /opt/learningsteps/venv/bin/pip install -r /opt/learningsteps/api/requirements.txt -q
  
    # 2. Fetch Secret from Key Vault and Setup DB
  - |
    export DB_PASS=$(curl -s "https://kv-lokiyn-ls.vault.azure.net/secrets/postgres-admin-password?api-version=7.4" -H "Authorization: Bearer $(curl -s 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net' -H Metadata:true | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
    until psql "postgresql://psqladmin:$${DB_PASS}@psql-$${prefix}.postgres.database.azure.com/learning_journal?sslmode=require" -c '\q' 2>/dev/null; do sleep 5; done
    psql "postgresql://psqladmin:$${DB_PASS}@psql-$${prefix}.postgres.database.azure.com/learning_journal?sslmode=require" -f /opt/learningsteps/database_setup.sql

  # 3. Start the App Service
  - systemctl daemon-reload
  - systemctl enable learningsteps
  - systemctl start learningsteps

  # Wait for any lingering apt locks to clear before installing Docker
  - |
    while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
      echo "Waiting for apt lock..."
      sleep 2
    done

  # 4. Install Docker
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker azureuser
  - systemctl enable --now docker

  # 5. Setup NPMplus and CrowdSec
  - mkdir -p /opt/npmplus
  - curl -L https://raw.githubusercontent.com/ZoeyVid/NPMplus/refs/heads/develop/compose.yaml -o /opt/npmplus/compose.yaml
  - sed -i 's/      - "TZ=your-timezone"/      - "TZ=Europe\/Berlin"\n      - "ACME_EMAIL=admin@example.com"/' /opt/npmplus/compose.yaml
  - sed -i 's/^#\(.*CROWDSEC=true\)/      - "CROWDSEC=true"/' /opt/npmplus/compose.yaml
  - |
    cat <<EOF >> /opt/npmplus/compose.yaml
      crowdsec:
        container_name: crowdsec
        restart: unless-stopped
        image: docker.io/crowdsecurity/crowdsec:latest
        pull_policy: always
        network_mode: bridge
        ports:
          - "127.0.0.1:7422:7422"
          - "127.0.0.1:8080:8080"
        environment:
          - "TZ=Europe/Berlin"
          - "USE_WAL=true"
          - "COLLECTIONS=ZoeyVid/npmplus"
        volumes:
          - "/opt/crowdsec/conf:/etc/crowdsec"
          - "/opt/crowdsec/data:/var/lib/crowdsec/data"
          - "/opt/npmplus/nginx/logs:/opt/npmplus/nginx/logs:ro"
    EOF
  - cd /opt/npmplus && docker compose up -d

  # 6. Setup OAuth2-Proxy
  - mkdir -p /etc/oauth2-proxy
  - curl -L https://github.com/oauth2-proxy/oauth2-proxy/releases/download/v7.15.5/oauth2-proxy-v7.15.5.linux-amd64.tar.gz -o /tmp/oauth2-proxy.tar.gz
  - tar -xzf /tmp/oauth2-proxy.tar.gz -C /tmp
  - mv /tmp/oauth2-proxy-v7.15.5.linux-amd64/oauth2-proxy /usr/local/bin/
  - chmod +x /usr/local/bin/oauth2-proxy
  - systemctl daemon-reload
  - systemctl enable --now oauth2-proxy